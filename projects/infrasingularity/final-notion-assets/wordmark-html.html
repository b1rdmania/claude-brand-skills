<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 60px;
      background: #0A0D10;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .mark {
      width: 64px;
      height: 64px;
      flex-shrink: 0;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 40px;
      letter-spacing: -0.4px;
      color: #fff;
      line-height: 1;
    }

    .infra {
      font-weight: 500;
    }

    .singularity {
      font-weight: 300;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #6B4FEC;
      border-radius: 50%;
      flex-shrink: 0;
      margin-left: 0;
      align-self: flex-end;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <!-- Mark SVG -->
  <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="32" cy="32" r="2.5" fill="#fff"/>
    <circle cx="32" cy="9" r="2.2" fill="#fff"/>
    <circle cx="32" cy="17" r="2.0" fill="#fff"/>
    <circle cx="32" cy="24" r="1.8" fill="#fff"/>
    <circle cx="46.5" cy="11.5" r="2.2" fill="#fff"/>
    <circle cx="41.5" cy="19" r="2.0" fill="#fff"/>
    <circle cx="37.5" cy="25" r="1.8" fill="#fff"/>
    <circle cx="55" cy="32" r="2.2" fill="#fff"/>
    <circle cx="47" cy="32" r="2.0" fill="#fff"/>
    <circle cx="40" cy="32" r="1.8" fill="#fff"/>
    <circle cx="46.5" cy="52.5" r="2.2" fill="#fff"/>
    <circle cx="41.5" cy="45" r="2.0" fill="#fff"/>
    <circle cx="37.5" cy="39" r="1.8" fill="#fff"/>
    <circle cx="32" cy="55" r="2.2" fill="#fff"/>
    <circle cx="32" cy="47" r="2.0" fill="#fff"/>
    <circle cx="32" cy="40" r="1.8" fill="#fff"/>
    <circle cx="17.5" cy="52.5" r="2.2" fill="#fff"/>
    <circle cx="22.5" cy="45" r="2.0" fill="#fff"/>
    <circle cx="26.5" cy="39" r="1.8" fill="#fff"/>
    <circle cx="9" cy="32" r="2.2" fill="#fff"/>
    <circle cx="17" cy="32" r="2.0" fill="#fff"/>
    <circle cx="24" cy="32" r="1.8" fill="#fff"/>
    <circle cx="17.5" cy="11.5" r="2.2" fill="#fff"/>
    <circle cx="22.5" cy="19" r="2.0" fill="#fff"/>
    <circle cx="26.5" cy="25" r="1.8" fill="#fff"/>
  </svg>

  <!-- Wordmark -->
  <div class="wordmark">
    <span class="infra">Infra</span><span class="singularity">Singularity</span><div class="dot"></div>
  </div>
</body>
</html>
