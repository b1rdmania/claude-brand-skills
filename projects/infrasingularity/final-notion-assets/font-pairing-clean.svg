<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1600" height="900" fill="#0A0D10"/>

  <!-- Title -->
  <text x="80" y="100" font-family="system-ui" font-size="48" font-weight="600" fill="#fff">
    Typography Pairing
  </text>
  <text x="80" y="145" font-family="system-ui" font-size="18" fill="rgba(255,255,255,0.5)">
    Outfit + Figtree — Geometric Cohesion
  </text>

  <!-- Outfit Section -->
  <text x="80" y="250" font-family="system-ui" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">
    DISPLAY / HEADINGS
  </text>

  <rect x="80" y="280" width="700" height="200" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <text x="120" y="340" font-family="system-ui" font-size="16" font-weight="600" fill="#6B4FEC">
    Outfit
  </text>
  <text x="120" y="365" font-family="system-ui" font-size="13" fill="rgba(255,255,255,0.6)">
    Medium 500, Light 300
  </text>

  <text x="120" y="430" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="500" fill="#fff" letter-spacing="-1">
    Infrastructure
  </text>

  <!-- Figtree Section -->
  <text x="820" y="250" font-family="system-ui" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">
    BODY / UI TEXT
  </text>

  <rect x="820" y="280" width="700" height="200" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <text x="860" y="340" font-family="system-ui" font-size="16" font-weight="600" fill="#4CAF8C">
    Figtree
  </text>
  <text x="860" y="365" font-family="system-ui" font-size="13" fill="rgba(255,255,255,0.6)">
    Regular 400, Medium 500
  </text>

  <text x="860" y="415" font-family="system-ui" font-size="18" font-weight="400" fill="rgba(255,255,255,0.85)" style="line-height: 1.7;">
    Institutional-grade blockchain infrastructure
  </text>
  <text x="860" y="445" font-family="system-ui" font-size="18" font-weight="400" fill="rgba(255,255,255,0.85)">
    for enterprises that demand reliability, security,
  </text>

  <!-- Why They Work -->
  <text x="80" y="570" font-family="system-ui" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="2">
    WHY THIS PAIRING WORKS
  </text>

  <rect x="80" y="600" width="480" height="200" rx="12" fill="rgba(107,79,236,0.05)" stroke="rgba(107,79,236,0.15)" stroke-width="2"/>

  <text x="120" y="650" font-family="system-ui" font-size="18" font-weight="600" fill="#fff">
    Similar X-Height
  </text>
  <text x="120" y="685" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)" style="line-height: 1.6;">
    Both fonts share geometric proportions,
  </text>
  <text x="120" y="710" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    creating visual harmony without disruption.
  </text>
  <text x="120" y="735" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    Hierarchy through weight, not font clash.
  </text>

  <rect x="590" y="600" width="480" height="200" rx="12" fill="rgba(107,79,236,0.05)" stroke="rgba(107,79,236,0.15)" stroke-width="2"/>

  <text x="630" y="650" font-family="system-ui" font-size="18" font-weight="600" fill="#fff">
    Technical Clarity
  </text>
  <text x="630" y="685" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    Figtree optimized for screen reading and
  </text>
  <text x="630" y="710" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    long-form technical content. Works with
  </text>
  <text x="630" y="735" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    Outfit's geometric precision perfectly.
  </text>

  <rect x="1100" y="600" width="420" height="200" rx="12" fill="rgba(107,79,236,0.05)" stroke="rgba(107,79,236,0.15)" stroke-width="2"/>

  <text x="1140" y="650" font-family="system-ui" font-size="18" font-weight="600" fill="#fff">
    Unified System
  </text>
  <text x="1140" y="685" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    Creates cohesive type system
  </text>
  <text x="1140" y="710" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    supporting "Gravitational Density"
  </text>
  <text x="1140" y="735" font-family="system-ui" font-size="15" font-weight="400" fill="rgba(255,255,255,0.8)">
    aesthetic — convergence, not chaos.
  </text>
</svg>
