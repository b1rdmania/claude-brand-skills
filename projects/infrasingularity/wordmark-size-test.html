<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>InfraSingularity Wordmark - Adjusted Size</title>
<style>
body {
  background: #0F1419;
  color: #fff;
  font-family: system-ui, sans-serif;
  padding: 40px;
  margin: 0;
}

h1 {
  font-size: 16px;
  color: #6B4FEC;
  margin-bottom: 50px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.test {
  margin-bottom: 80px;
  padding-bottom: 40px;
  border-bottom: 1px solid #222;
}

.label {
  font-size: 13px;
  color: #888;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.context {
  font-size: 12px;
  color: #555;
  margin-bottom: 20px;
}

img {
  display: block;
  margin-bottom: 12px;
}
</style>
</head>
<body>

<h1>InfraSingularity Wordmark — Text Scaled Up (32px)</h1>

<div class="test">
  <div class="label">Hero Size (200px height)</div>
  <div class="context">Text now more prominent relative to mark</div>
  <img src="is-wordmark-primary-hero.png" alt="Hero">
</div>

<div class="test">
  <div class="label">Navigation Size (40px height)</div>
  <div class="context">Better balance between mark and wordmark</div>
  <img src="is-wordmark-primary-nav.png" alt="Nav">
</div>

<div class="test">
  <div class="label">Compact Size (24px height)</div>
  <div class="context">Minimum viable size</div>
  <img src="is-wordmark-primary-compact.png" alt="Compact">
</div>

</body>
</html>
