<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v5b - Solid rays, alternating lengths (cardinal longer) -->

  <!-- Violet center -->
  <circle cx="32" cy="32" r="3" fill="#8B5CF6"/>

  <!-- 4 long cardinal rays -->
  <line x1="32" y1="32" x2="32" y2="8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="56" y2="32" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="32" y2="56" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="8" y2="32" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 4 shorter diagonal rays -->
  <line x1="32" y1="32" x2="44" y2="20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="44" y2="44" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="20" y2="44" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="20" y2="20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
