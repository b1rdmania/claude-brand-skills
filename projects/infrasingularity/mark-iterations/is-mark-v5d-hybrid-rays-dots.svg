<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v5d - Hybrid: short rays with dot tips -->

  <!-- Violet center -->
  <circle cx="32" cy="32" r="3" fill="#8B5CF6"/>

  <!-- 8 short rays with dots at tips -->
  <!-- North -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="12" r="1.5" fill="#fff"/>

  <!-- NE -->
  <line x1="32" y1="32" x2="42.5" y2="21.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47.3" cy="16.7" r="1.5" fill="#fff"/>

  <!-- East -->
  <line x1="32" y1="32" x2="46" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="52" cy="32" r="1.5" fill="#fff"/>

  <!-- SE -->
  <line x1="32" y1="32" x2="42.5" y2="42.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="47.3" cy="47.3" r="1.5" fill="#fff"/>

  <!-- South -->
  <line x1="32" y1="32" x2="32" y2="46" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="52" r="1.5" fill="#fff"/>

  <!-- SW -->
  <line x1="32" y1="32" x2="21.5" y2="42.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16.7" cy="47.3" r="1.5" fill="#fff"/>

  <!-- West -->
  <line x1="32" y1="32" x2="18" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="12" cy="32" r="1.5" fill="#fff"/>

  <!-- NW -->
  <line x1="32" y1="32" x2="21.5" y2="21.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16.7" cy="16.7" r="1.5" fill="#fff"/>
</svg>
