<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v5h - Rays with double dots (inner + outer) -->

  <!-- Violet center -->
  <circle cx="32" cy="32" r="3" fill="#8B5CF6"/>

  <!-- 8 rays with 2 dots each -->
  <!-- North -->
  <line x1="32" y1="32" x2="32" y2="16" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="22" r="1.3" fill="#fff"/>
  <circle cx="32" cy="11" r="1" fill="#fff"/>

  <!-- NE -->
  <line x1="32" y1="32" x2="43.3" y2="20.7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="37" cy="27" r="1.3" fill="#fff"/>
  <circle cx="47.8" cy="16.2" r="1" fill="#fff"/>

  <!-- East -->
  <line x1="32" y1="32" x2="48" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="42" cy="32" r="1.3" fill="#fff"/>
  <circle cx="53" cy="32" r="1" fill="#fff"/>

  <!-- SE -->
  <line x1="32" y1="32" x2="43.3" y2="43.3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="37" cy="37" r="1.3" fill="#fff"/>
  <circle cx="47.8" cy="47.8" r="1" fill="#fff"/>

  <!-- South -->
  <line x1="32" y1="32" x2="32" y2="48" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="1.3" fill="#fff"/>
  <circle cx="32" cy="53" r="1" fill="#fff"/>

  <!-- SW -->
  <line x1="32" y1="32" x2="20.7" y2="43.3" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="27" cy="37" r="1.3" fill="#fff"/>
  <circle cx="16.2" cy="47.8" r="1" fill="#fff"/>

  <!-- West -->
  <line x1="32" y1="32" x2="16" y2="32" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="22" cy="32" r="1.3" fill="#fff"/>
  <circle cx="11" cy="32" r="1" fill="#fff"/>

  <!-- NW -->
  <line x1="32" y1="32" x2="20.7" y2="20.7" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="27" cy="27" r="1.3" fill="#fff"/>
  <circle cx="16.2" cy="16.2" r="1" fill="#fff"/>
</svg>
