<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>InfraSingularity Wordmark - Final Two Options</title>
<style>
body {
  background: #0F1419;
  color: #fff;
  font-family: system-ui, sans-serif;
  padding: 40px;
  margin: 0;
}

h1 {
  font-size: 16px;
  color: #6B4FEC;
  margin-bottom: 50px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

.comparison {
  margin-bottom: 100px;
}

.size-label {
  font-size: 14px;
  color: #888;
  margin-bottom: 30px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  margin-bottom: 60px;
  padding-bottom: 60px;
  border-bottom: 1px solid #1a1a1a;
}

.option {
}

.label {
  font-size: 12px;
  color: #666;
  margin-bottom: 16px;
}

img {
  display: block;
  max-width: 100%;
  height: auto;
}
</style>
</head>
<body>

<h1>InfraSingularity — Final Two Options</h1>

<div class="comparison">
  <div class="size-label">Hero Size (200px)</div>
  <div class="row">
    <div class="option">
      <div class="label">Option A: "Singularity" Purple</div>
      <img src="is-wordmark-primary-purple-singularity-hero.png">
    </div>
    <div class="option">
      <div class="label">Option B: "S" Purple</div>
      <img src="is-wordmark-primary-purple-S-hero.png">
    </div>
  </div>
</div>

<div class="comparison">
  <div class="size-label">Navigation Size (40px)</div>
  <div class="row">
    <div class="option">
      <div class="label">Option A: "Singularity" Purple</div>
      <img src="is-wordmark-primary-purple-singularity-nav.png">
    </div>
    <div class="option">
      <div class="label">Option B: "S" Purple</div>
      <img src="is-wordmark-primary-purple-S-nav.png">
    </div>
  </div>
</div>

<div class="comparison">
  <div class="size-label">Compact Size (24px)</div>
  <div class="row">
    <div class="option">
      <div class="label">Option A: "Singularity" Purple</div>
      <img src="is-wordmark-primary-purple-singularity-compact.png">
    </div>
    <div class="option">
      <div class="label">Option B: "S" Purple</div>
      <img src="is-wordmark-primary-purple-S-compact.png">
    </div>
  </div>
</div>

</body>
</html>
