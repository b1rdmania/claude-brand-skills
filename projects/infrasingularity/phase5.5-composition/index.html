<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0D10">
  <title>InfraSingularity</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { background-color: #0A0D10; }

    body {
      font-family: 'Figtree', sans-serif;
      background: #0A0D10;
      color: #F5F5F7;
      height: 100svh;
      overflow: hidden;
    }

    /* ─── Desktop layout ──────────────────────── */
    .splash {
      position: relative;
      height: 100svh;
      overflow: hidden;
    }

    .panel-purple {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #6B4FEC;
      clip-path: polygon(0 0, 55% 0, 42% 100%, 0 100%);
    }

    .splash-wordmark {
      position: absolute;
      top: 48px; left: 56px;
      z-index: 3;
    }

    .splash-wordmark svg { height: 64px; width: auto; }

    .panel-left {
      position: absolute;
      top: 0; left: 0;
      width: 50%; height: 100%;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      z-index: 2;
    }

    .splash-heading {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(40px, 5vw, 64px);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: #000;
      text-transform: uppercase;
      padding-bottom: 80px;
    }

    .panel-right {
      position: absolute;
      top: 0; right: 0;
      width: 46%; height: 100%;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 16px;
      z-index: 2;
    }

    .stat-block {
      flex: 1;
      padding: 24px 28px;
      border: 2px solid;
      background: rgba(255,255,255,0.02);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .stat-block:nth-child(1) { border-color: #4CAF8C; }
    .stat-block:nth-child(2) { border-color: #F59E42; }
    .stat-block:nth-child(3) { border-color: #5B9EFF; }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(44px, 5vw, 68px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .stat-block:nth-child(1) .stat-value { color: #4CAF8C; }
    .stat-block:nth-child(2) .stat-value { color: #F59E42; }
    .stat-block:nth-child(3) .stat-value { color: #5B9EFF; }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #6E7178;
    }

    .enter-cta {
      position: absolute;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      border: 1px solid #3D4449;
      background: transparent;
      color: #C4C6CB;
      font-family: 'Figtree', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: all 200ms cubic-bezier(0.33, 1, 0.68, 1);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .enter-btn:hover, .enter-btn:focus {
      border-color: #6B4FEC;
      color: #F5F5F7;
      background: rgba(107, 79, 236, 0.06);
    }

    .enter-arrow { transition: transform 200ms cubic-bezier(0.33, 1, 0.68, 1); }
    .enter-btn:hover .enter-arrow { transform: translateX(4px); }

    /* ─── Mobile layout ───────────────────────── */
    @media (max-width: 640px) {
      body { height: 100svh; overflow: hidden; }

      .splash {
        display: flex;
        flex-direction: column;
        height: 100svh;
        overflow: hidden;
      }

      /* Purple top band */
      .panel-purple {
        clip-path: none;
        position: relative;
        width: 100%;
        height: auto;
        flex: 0 0 auto;
      }

      .panel-left {
        position: relative;
        width: 100%;
        height: auto;
        padding: 20px 24px 28px;
        justify-content: flex-start;
        background: #6B4FEC;
      }

      .splash-wordmark {
        position: relative;
        top: auto; left: auto;
        margin-bottom: 20px;
      }

      .splash-wordmark svg { height: 40px; }

      .splash-heading {
        font-size: clamp(32px, 9vw, 48px);
        color: #000;
        padding-bottom: 0;
      }

      /* Stats take remaining space */
      .panel-right {
        position: relative;
        top: auto; right: auto;
        width: 100%;
        height: auto;
        flex: 1;
        padding: 16px 20px;
        gap: 12px;
        overflow: hidden;
      }

      .stat-block {
        padding: 14px 20px;
        flex: 1;
      }

      .stat-value { font-size: clamp(32px, 8vw, 48px); margin-bottom: 4px; }
      .stat-label { font-size: 10px; }

      /* Enter button — fixed at bottom */
      .enter-cta {
        position: relative;
        bottom: auto;
        left: auto;
        transform: none;
        padding: 16px 20px;
        background: #0A0D10;
        border-top: 1px solid #2D3339;
      }

      .enter-btn {
        display: flex;
        justify-content: center;
        width: 100%;
        padding: 16px 32px;
      }
    }
  </style>
</head>
<body>
  <div class="splash">

    <div class="panel-purple"></div>

    <!-- Wordmark -->
    <div class="splash-wordmark">
      <svg viewBox="0 0 475 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(0,0)">
          <circle cx="32" cy="32" r="2.5" fill="#fff"/>
          <circle cx="32" cy="9"  r="2.2" fill="#fff"/><circle cx="32" cy="17" r="2.0" fill="#fff"/>
          <circle cx="32" cy="24" r="1.8" fill="#fff"/><circle cx="46.5" cy="11.5" r="2.2" fill="#fff"/>
          <circle cx="41.5" cy="19" r="2.0" fill="#fff"/><circle cx="37.5" cy="25" r="1.8" fill="#fff"/>
          <circle cx="55"  cy="32" r="2.2" fill="#fff"/><circle cx="47"  cy="32" r="2.0" fill="#fff"/>
          <circle cx="40"  cy="32" r="1.8" fill="#fff"/><circle cx="46.5" cy="52.5" r="2.2" fill="#fff"/>
          <circle cx="41.5" cy="45" r="2.0" fill="#fff"/><circle cx="37.5" cy="39" r="1.8" fill="#fff"/>
          <circle cx="32"  cy="55" r="2.2" fill="#fff"/><circle cx="32"  cy="47" r="2.0" fill="#fff"/>
          <circle cx="32"  cy="40" r="1.8" fill="#fff"/><circle cx="17.5" cy="52.5" r="2.2" fill="#fff"/>
          <circle cx="22.5" cy="45" r="2.0" fill="#fff"/><circle cx="26.5" cy="39" r="1.8" fill="#fff"/>
          <circle cx="9"   cy="32" r="2.2" fill="#fff"/><circle cx="17"  cy="32" r="2.0" fill="#fff"/>
          <circle cx="24"  cy="32" r="1.8" fill="#fff"/><circle cx="17.5" cy="11.5" r="2.2" fill="#fff"/>
          <circle cx="22.5" cy="19" r="2.0" fill="#fff"/><circle cx="26.5" cy="25" r="1.8" fill="#fff"/>
        </g>
        <text x="80" y="45" font-family="Outfit, sans-serif" font-size="40" letter-spacing="-0.4" fill="#fff">
          <tspan font-weight="500">Infra</tspan><tspan font-weight="300">Singularity</tspan>
        </text>
      </svg>
    </div>

    <!-- Left: heading -->
    <div class="panel-left">
      <div class="splash-heading">Institutional<br>Infrastructure</div>
    </div>

    <!-- Right: stats -->
    <div class="panel-right">
      <div class="stat-block">
        <div class="stat-value">50+</div>
        <div class="stat-label">Mainnet Protocols</div>
      </div>
      <div class="stat-block">
        <div class="stat-value">Top 10</div>
        <div class="stat-label">Symbiotic by AUM</div>
      </div>
      <div class="stat-block">
        <div class="stat-value">99.99%</div>
        <div class="stat-label">Infrastructure Uptime</div>
      </div>
    </div>

    <!-- Enter -->
    <div class="enter-cta">
      <a href="/site" class="enter-btn">
        Enter <span class="enter-arrow">→</span>
      </a>
    </div>

  </div>
</body>
</html>
