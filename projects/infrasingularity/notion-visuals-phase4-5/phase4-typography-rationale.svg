<svg width="1400" height="800" viewBox="0 0 1400 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="800" fill="#0A0D10"/>

  <!-- Title -->
  <text x="60" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#6B4FEC" letter-spacing="2">
    PHASE 4: WORDMARK TYPOGRAPHY
  </text>

  <!-- Main Heading -->
  <text x="60" y="130" font-family="system-ui" font-size="32" font-weight="600" fill="#fff">
    Outfit — Geometric Precision
  </text>

  <!-- Rationale Section -->
  <text x="60" y="180" font-family="system-ui" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">
    WHY OUTFIT?
  </text>

  <rect x="60" y="205" width="580" height="180" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="80" y="235" font-family="system-ui" font-size="14" font-weight="500" fill="#fff">
    ✓ Geometric sans-serif aligns with mark's precision
  </text>
  <text x="80" y="265" font-family="system-ui" font-size="14" font-weight="400" fill="rgba(255,255,255,0.8)">
    Clean, technical letterforms echo the dot geometry
  </text>

  <text x="80" y="300" font-family="system-ui" font-size="14" font-weight="500" fill="#fff">
    ✓ Variable weights create "Gravitational Density"
  </text>
  <text x="80" y="330" font-family="system-ui" font-size="14" font-weight="400" fill="rgba(255,255,255,0.8)">
    Medium 500 (Infra) + Light 300 (Singularity) = visual tension
  </text>

  <text x="80" y="365" font-family="system-ui" font-size="14" font-weight="500" fill="#fff">
    ✓ Institutional without being corporate
  </text>

  <!-- Weight Comparison -->
  <text x="680" y="180" font-family="system-ui" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">
    WEIGHT EXPLORATION
  </text>

  <rect x="680" y="205" width="660" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="700" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="300" fill="rgba(255,255,255,0.6)">
    InfraSingularity
  </text>
  <text x="1140" y="245" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.4)">Light 300</text>

  <rect x="680" y="280" width="660" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="700" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" fill="#fff">
    InfraSingularity
  </text>
  <text x="1100" y="320" font-family="system-ui" font-size="11" fill="#6B4FEC">Medium 500 — Selected</text>

  <rect x="680" y="355" width="660" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="700" y="395" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="600" fill="rgba(255,255,255,0.6)">
    InfraSingularity
  </text>
  <text x="1100" y="395" font-family="system-ui" font-size="11" fill="rgba(255,255,255,0.4)">Semibold 600</text>

  <!-- Final Lockup -->
  <text x="60" y="470" font-family="system-ui" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">
    FINAL WORDMARK LOCKUP
  </text>

  <rect x="60" y="495" width="1280" height="120" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Mark -->
  <g transform="translate(90, 530) scale(0.7)">
    <circle cx="32" cy="32" r="2.5" fill="#fff"/>
    <circle cx="32" cy="9" r="2.2" fill="#fff"/>
    <circle cx="32" cy="17" r="2.0" fill="#fff"/>
    <circle cx="32" cy="24" r="1.8" fill="#fff"/>
    <circle cx="46.5" cy="11.5" r="2.2" fill="#fff"/>
    <circle cx="41.5" cy="19" r="2.0" fill="#fff"/>
    <circle cx="37.5" cy="25" r="1.8" fill="#fff"/>
    <circle cx="55" cy="32" r="2.2" fill="#fff"/>
    <circle cx="47" cy="32" r="2.0" fill="#fff"/>
    <circle cx="40" cy="32" r="1.8" fill="#fff"/>
    <circle cx="46.5" cy="52.5" r="2.2" fill="#fff"/>
    <circle cx="41.5" cy="45" r="2.0" fill="#fff"/>
    <circle cx="37.5" cy="39" r="1.8" fill="#fff"/>
    <circle cx="32" cy="55" r="2.2" fill="#fff"/>
    <circle cx="32" cy="47" r="2.0" fill="#fff"/>
    <circle cx="32" cy="40" r="1.8" fill="#fff"/>
    <circle cx="17.5" cy="52.5" r="2.2" fill="#fff"/>
    <circle cx="22.5" cy="45" r="2.0" fill="#fff"/>
    <circle cx="26.5" cy="39" r="1.8" fill="#fff"/>
    <circle cx="9" cy="32" r="2.2" fill="#fff"/>
    <circle cx="17" cy="32" r="2.0" fill="#fff"/>
    <circle cx="24" cy="32" r="1.8" fill="#fff"/>
    <circle cx="17.5" cy="11.5" r="2.2" fill="#fff"/>
    <circle cx="22.5" cy="19" r="2.0" fill="#fff"/>
    <circle cx="26.5" cy="25" r="1.8" fill="#fff"/>
  </g>

  <!-- Wordmark with dual weights -->
  <text x="150" y="570" font-family="system-ui, -apple-system, sans-serif" font-size="36" letter-spacing="-0.4" fill="#fff">
    <tspan font-weight="500">Infra</tspan><tspan font-weight="300">Singularity</tspan>
  </text>

  <!-- Purple dot -->
  <circle cx="475" cy="562" r="3.5" fill="#6B4FEC"/>

  <!-- Annotations -->
  <line x1="150" y1="590" x2="230" y2="590" stroke="#6B4FEC" stroke-width="1"/>
  <text x="150" y="608" font-family="monospace" font-size="10" fill="#6B4FEC">
    Medium 500
  </text>

  <line x1="235" y1="590" x2="465" y2="590" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="310" y="608" font-family="monospace" font-size="10" fill="rgba(255,255,255,0.5)">
    Light 300
  </text>

  <line x1="475" y1="565" x2="485" y2="565" stroke="#6B4FEC" stroke-width="1"/>
  <text x="490" y="570" font-family="monospace" font-size="10" fill="#6B4FEC">
    7px purple dot
  </text>

  <!-- Specifications -->
  <text x="60" y="670" font-family="system-ui" font-size="13" font-weight="600" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">
    TECHNICAL SPECIFICATIONS
  </text>

  <rect x="60" y="695" width="400" height="80" rx="6" fill="rgba(107,79,236,0.05)" stroke="rgba(107,79,236,0.2)" stroke-width="1"/>
  <text x="80" y="720" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    font-family: 'Outfit', sans-serif
  </text>
  <text x="80" y="740" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    font-size: 40px
  </text>
  <text x="80" y="760" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    letter-spacing: -0.4px (tight tracking)
  </text>

  <rect x="480" y="695" width="400" height="80" rx="6" fill="rgba(107,79,236,0.05)" stroke="rgba(107,79,236,0.2)" stroke-width="1"/>
  <text x="500" y="720" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    gap-from-mark: 16px (tight density)
  </text>
  <text x="500" y="740" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    accent-color: #6B4FEC (purple dot)
  </text>
  <text x="500" y="760" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    accent-size: 7px diameter
  </text>

  <rect x="900" y="695" width="440" height="80" rx="6" fill="rgba(107,79,236,0.05)" stroke="rgba(107,79,236,0.2)" stroke-width="1"/>
  <text x="920" y="720" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    weight-contrast: Medium 500 + Light 300
  </text>
  <text x="920" y="740" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
    rationale: "Infra" (heavy) anchors,
  </text>
  <text x="920" y="760" font-family="monospace" font-size="11" fill="rgba(255,255,255,0.9)">
              "Singularity" (light) expands
  </text>
</svg>
