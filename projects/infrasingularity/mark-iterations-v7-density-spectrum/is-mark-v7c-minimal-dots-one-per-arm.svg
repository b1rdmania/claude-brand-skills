  <circle cx="32" cy="33.5" r="1.0" fill="#fff"/>

  <!-- 8 arms (1 dot each at outer edge) -->
  <circle cx="32" cy="14" r="1.5" fill="#fff"/>
  <circle cx="46" cy="17" r="1.5" fill="#fff"/>
  <circle cx="50" cy="32" r="1.5" fill="#fff"/>
  <circle cx="46" cy="47" r="1.5" fill="#fff"/>
  <circle cx="32" cy="50" r="1.5" fill="#fff"/>
  <circle cx="17" cy="47" r="1.5" fill="#fff"/>
  <circle cx="14" cy="32" r="1.5" fill="#fff"/>
  <circle cx="17" cy="17" r="1.5" fill="#fff"/>
</svg>
