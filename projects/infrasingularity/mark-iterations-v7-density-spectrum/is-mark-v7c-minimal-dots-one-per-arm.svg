<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v7c - Minimal: Center + one dot per arm -->

  <!-- Center dot cluster (5 dots) -->
  <circle cx="32" cy="32" r="1.5" fill="#fff"/>
  <circle cx="30.5" cy="32" r="1.0" fill="#fff"/>
  <circle cx="33.5" cy="32" r="1.0" fill="#fff"/>
