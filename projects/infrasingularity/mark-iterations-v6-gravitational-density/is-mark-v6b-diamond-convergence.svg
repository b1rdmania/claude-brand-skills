<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v6b - Diamond frame + converging dots (from deck geometry) -->

  <!-- Diamond frame (violet) - rotated square from deck -->
  <path d="M 32 12 L 52 32 L 32 52 L 12 32 Z" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>

  <!-- Dense violet center (singularity) -->
  <circle cx="32" cy="32" r="2.5" fill="#8B5CF6"/>
  <circle cx="30" cy="32" r="1.8" fill="#8B5CF6"/>
  <circle cx="34" cy="32" r="1.8" fill="#8B5CF6"/>
  <circle cx="32" cy="30" r="1.8" fill="#8B5CF6"/>
  <circle cx="32" cy="34" r="1.8" fill="#8B5CF6"/>

  <!-- Dots converging from diamond corners -->
  <!-- North corner -->
  <circle cx="32" cy="16" r="1.2" fill="#fff"/>
  <circle cx="32" cy="20" r="1.4" fill="#fff"/>
  <circle cx="32" cy="25" r="1.6" fill="#fff"/>

  <!-- East corner -->
  <circle cx="48" cy="32" r="1.2" fill="#fff"/>
  <circle cx="44" cy="32" r="1.4" fill="#fff"/>
  <circle cx="39" cy="32" r="1.6" fill="#fff"/>

  <!-- South corner -->
  <circle cx="32" cy="48" r="1.2" fill="#fff"/>
  <circle cx="32" cy="44" r="1.4" fill="#fff"/>
  <circle cx="32" cy="39" r="1.6" fill="#fff"/>

  <!-- West corner -->
  <circle cx="16" cy="32" r="1.2" fill="#fff"/>
  <circle cx="20" cy="32" r="1.4" fill="#fff"/>
  <circle cx="25" cy="32" r="1.6" fill="#fff"/>

  <!-- Diagonal corners -->
  <circle cx="42" cy="22" r="1.0" fill="#fff"/>
  <circle cx="38" cy="26" r="1.3" fill="#fff"/>

  <circle cx="42" cy="42" r="1.0" fill="#fff"/>
  <circle cx="38" cy="38" r="1.3" fill="#fff"/>

  <circle cx="22" cy="42" r="1.0" fill="#fff"/>
  <circle cx="26" cy="38" r="1.3" fill="#fff"/>

  <circle cx="22" cy="22" r="1.0" fill="#fff"/>
  <circle cx="26" cy="26" r="1.3" fill="#fff"/>
</svg>
