<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v6a - Bracket framing + dense center (from deck motif) -->

  <!-- Bracket frame (violet) - from deck's [ ] motif -->
  <path d="M 18 18 L 14 18 L 14 46 L 18 46" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>
  <path d="M 46 18 L 50 18 L 50 46 L 46 46" stroke="#8B5CF6" stroke-width="1.5" fill="none"/>

  <!-- Dense violet center cluster (gravitational core) -->
  <circle cx="32" cy="32" r="2.2" fill="#8B5CF6"/>
  <circle cx="30" cy="32" r="1.7" fill="#8B5CF6"/>
  <circle cx="34" cy="32" r="1.7" fill="#8B5CF6"/>
  <circle cx="32" cy="30" r="1.7" fill="#8B5CF6"/>
  <circle cx="32" cy="34" r="1.7" fill="#8B5CF6"/>
  <circle cx="30.5" cy="30.5" r="1.4" fill="#8B5CF6"/>
  <circle cx="33.5" cy="33.5" r="1.4" fill="#8B5CF6"/>
  <circle cx="30.5" cy="33.5" r="1.4" fill="#8B5CF6"/>
  <circle cx="33.5" cy="30.5" r="1.4" fill="#8B5CF6"/>

  <!-- 8 arms converging toward center (white dots, decreasing size) -->
  <!-- North -->
  <circle cx="32" cy="13" r="1.0" fill="#fff"/>
  <circle cx="32" cy="18" r="1.3" fill="#fff"/>
  <circle cx="32" cy="24" r="1.6" fill="#fff"/>

  <!-- NE -->
  <circle cx="46.5" cy="15.5" r="1.0" fill="#fff"/>
  <circle cx="42.4" cy="19.6" r="1.3" fill="#fff"/>
  <circle cx="37.7" cy="24.3" r="1.6" fill="#fff"/>

  <!-- East -->
  <circle cx="51" cy="32" r="1.0" fill="#fff"/>
  <circle cx="46" cy="32" r="1.3" fill="#fff"/>
  <circle cx="40" cy="32" r="1.6" fill="#fff"/>

  <!-- SE -->
  <circle cx="46.5" cy="48.5" r="1.0" fill="#fff"/>
  <circle cx="42.4" cy="44.4" r="1.3" fill="#fff"/>
  <circle cx="37.7" cy="39.7" r="1.6" fill="#fff"/>

  <!-- South -->
  <circle cx="32" cy="51" r="1.0" fill="#fff"/>
  <circle cx="32" cy="46" r="1.3" fill="#fff"/>
  <circle cx="32" cy="40" r="1.6" fill="#fff"/>

  <!-- SW -->
  <circle cx="15.5" cy="48.5" r="1.0" fill="#fff"/>
  <circle cx="19.6" cy="44.4" r="1.3" fill="#fff"/>
  <circle cx="24.3" cy="39.7" r="1.6" fill="#fff"/>

  <!-- West -->
  <circle cx="13" cy="32" r="1.0" fill="#fff"/>
  <circle cx="18" cy="32" r="1.3" fill="#fff"/>
  <circle cx="24" cy="32" r="1.6" fill="#fff"/>

  <!-- NW -->
  <circle cx="15.5" cy="15.5" r="1.0" fill="#fff"/>
  <circle cx="19.6" cy="19.6" r="1.3" fill="#fff"/>
  <circle cx="24.3" cy="24.3" r="1.6" fill="#fff"/>
</svg>
